services:
  telegram-bot-api:
    build:
      context: .
      dockerfile: telegram-bot-api.Dockerfile
    command:
      - --api-id=${TELEGRAM_API_ID}
      - --api-hash=${TELEGRAM_API_HASH}
      - --local
      - --http-port=8081
      - --dir=/var/lib/telegram-bot-api
    volumes:
      - telegram-files:/var/lib/telegram-bot-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "</dev/tcp/127.0.0.1/8081"]
      interval: 15s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      PORT: 8080
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - app-data:/app/data
      - telegram-files:/var/lib/telegram-bot-api:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  app-data:
  telegram-files:
  caddy-data:
  caddy-config:
