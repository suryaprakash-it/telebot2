services:
  telegram-bot-api:
    build:
      context: .
      dockerfile: telegram-bot-api.Dockerfile
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram-files:/var/lib/telegram-bot-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "</dev/tcp/127.0.0.1/8081"]
      interval: 15s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      PORT: 8080
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - app-data:/app/data
      - telegram-files:/var/lib/telegram-bot-api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  app-data:
  telegram-files:
  caddy-data:
  caddy-config:
